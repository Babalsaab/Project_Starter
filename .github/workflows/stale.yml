name: Stale Issues & PRs

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed in 14 days if no further
            activity occurs. If this issue is still relevant, please comment or
            remove the stale label.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had recent activity. It will be closed in 14 days if no
            further activity occurs. Please rebase and update if still needed.
          close-issue-message: >
            This issue was closed automatically due to inactivity. Feel free to
            reopen if the problem persists.
          close-pr-message: >
            This PR was closed automatically due to inactivity. Please reopen
            with a fresh branch if the changes are still desired.
          exempt-issue-labels: "pinned,security,bug"
          exempt-pr-labels: "pinned,security"
          operations-per-run: 100
