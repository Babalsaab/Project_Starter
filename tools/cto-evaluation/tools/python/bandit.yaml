# =============================================================================
# Bandit Security Configuration for Python
# =============================================================================
# Bandit is a tool for finding common security issues in Python code.
# Docs: https://bandit.readthedocs.io/
# =============================================================================

# Skip these test IDs
skips:
  - B101  # assert_used - OK in tests
  - B404  # import_subprocess - we use it safely
  - B603  # subprocess_without_shell_equals_true - we handle this

# Exclude these paths
exclude_dirs:
  - tests
  - .venv
  - venv
  - node_modules
  - .git

# Additional plugin configs
any_other_function_with_shell_equals_true:
  no_shell:
    - os.execl
    - os.execle
    - os.execlp
    - os.execlpe
    - os.execv
    - os.execve
    - os.execvp
    - os.execvpe
    - os.spawnl
    - os.spawnle
    - os.spawnlp
    - os.spawnlpe
    - os.spawnv
    - os.spawnve
    - os.spawnvp
    - os.spawnvpe
    - os.startfile

# Severity levels to report
severity: medium

# Confidence levels to report
confidence: medium
