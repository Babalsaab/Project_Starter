# =============================================================================
# SonarQube Project Configuration Template
# =============================================================================
# Copy this file to your project root and customize as needed.
# =============================================================================

# Project identification
sonar.projectKey=my-project
sonar.projectName=My Project
sonar.projectVersion=1.0.0

# Source directories (comma-separated)
sonar.sources=src,lib

# Test directories (comma-separated)
sonar.tests=tests,test,__tests__

# Exclusions (comma-separated patterns)
sonar.exclusions=**/node_modules/**,**/vendor/**,**/*.min.js,**/dist/**,**/build/**

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/vendor/**

# Coverage report paths (language-specific)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
sonar.go.coverage.reportPaths=coverage.out

# Encoding
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx
sonar.python.file.suffixes=py

# Quality gate
sonar.qualitygate.wait=true

# Duplications
sonar.cpd.exclusions=**/*test*/**,**/*spec*/**
