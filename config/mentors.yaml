# ─────────────────────────────────────────────
# ORCHESTRATOR REVIEW PASSES
# Applied after major pipeline milestones
# ─────────────────────────────────────────────

review_passes:
  after_planning:
    - mentor: "steve_jobs"
      focus: "UX flows, product decisions, storytelling"
      question: "Would this feel magical and simple to users?"
    - mentor: "paul_graham"
      focus: "Problem validation, user need"
      question: "Does this solve a real problem people actually have?"
    - mentor: "sun_tzu"
      focus: "Competitive positioning, strategic resource allocation"
      question: "Do we fully understand the competitive landscape and are we positioned to win?"

  after_design:
    - mentor: "jony_ive"
      focus: "Visual design, detail quality, material honesty"
      question: "Does every detail feel intentional?"
    - mentor: "leonardo_da_vinci"
      focus: "Systems design, information architecture"
      question: "Is the system architecture visually clear and elegant?"
    - mentor: "dieter_rams"
      focus: "Functional design, less but better, design honesty"
      question: "Is this design as little design as possible — have we removed everything non-essential?"

  after_build:
    - mentor: "linus_torvalds"
      focus: "Code maintainability, technical debt"
      question: "Is this code simple, readable, and maintainable?"
    - mentor: "steve_wozniak"
      focus: "Engineering architecture, elegance"
      question: "Could this be simpler with fewer moving parts?"
    - mentor: "claude_shannon"
      focus: "Signal vs noise, data efficiency, information integrity"
      question: "Are we separating signal from noise and encoding information efficiently?"

  after_testing:
    - mentor: "margaret_hamilton"
      focus: "Error handling, reliability, edge cases"
      question: "What happens when this fails? Is every error handled?"
    - mentor: "peter_steinberger"
      focus: "Development velocity, AI tooling"
      question: "Are we shipping small and fast enough?"
    - mentor: "marie_curie"
      focus: "Scientific rigor, reproducibility, precision"
      question: "Is our testing methodology rigorous and reproducible?"

  after_deploy:
    - mentor: "elon_musk"
      focus: "First principles, eliminating unnecessary complexity"
      question: "Can we eliminate any of these steps entirely?"
    - mentor: "jeff_bezos"
      focus: "Customer impact, long-term thinking"
      question: "Does this serve the customer's actual need?"
    - mentor: "nassim_taleb"
      focus: "Antifragility, black swan preparedness, risk management"
      question: "Is our deployed system antifragile — does it gain from stress rather than break?"


