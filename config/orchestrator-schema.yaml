schema_version: "2.0.0"
file_type: "vibecoded_orchestrator_schema"
# This file is the runtime schema. The orchestrator reads globals.yaml +
# the active project's overrides.yaml, then fills in the run_context.

# ═══════════════════════════════════════════════════════
# SECTION 1 — PROJECT PROFILE (filled per project)
# ═══════════════════════════════════════════════════════
project_profile:
  project_id: ""            # auto-generated: "<slug>-YYYY-MM-DD"
  project_name: ""
  project_type: ""          # mobile_app | web_app | landing_page | email_campaign
                            # blog | ecommerce | saas | multi_channel_launch

  objective:
    primary_goal: ""        # e.g. "Launch an MVP dating app for professionals in India"
    secondary_goals: []
    time_horizon: ""        # "7 days" | "1 month" | "Q1 2026"

  success_metrics:
    primary_kpis: []        # ["DAU", "signups", "CTR", "MQL"]
    target_values: {}       # {"signups": "500/month", "CTR": "10%"}

  audience:
    segments: []
    geography: []           # ["IN", "US"]
    persona_notes: ""

  environment:
    stage: "dev"            # dev | staging | prod
    channels_in_scope: []   # web | ios | android | email | social | ads | push

  overrides:
    brand_voice: {}         # overrides globals.brand_voice for this project
    constraints: {}
    token_policy: {}        # e.g. {max_total_tokens: 48000}

# ═══════════════════════════════════════════════════════
# SECTION 2 — RUN CONTEXT (filled per orchestration run)
# ═══════════════════════════════════════════════════════
run_context:
  run_id: ""                # auto: "run-<timestamp>"
  triggered_by: "user"      # user | schedule | event
  user_prompt: ""           # the raw request

  classified_domain: ""     # filled by orchestrator — e.g. "marketing/email"
  urgency: "normal"         # low | normal | high
  orchestration_pattern: "supervisor"   # supervisor | sequential | parallel | hybrid

  token_budget:
    remaining_total_tokens: 0    # set from globals or project override
    max_tokens_this_step: 0

  logging:
    trace_id: ""
    log_level: "summary"    # none | summary | detailed

# ═══════════════════════════════════════════════════════
# SECTION 3 — TASK PLAN (generated by orchestrator)
# ═══════════════════════════════════════════════════════
task_plan:
  high_level_steps: []      # human-readable ordered steps

  subtasks:
    # Template — orchestrator generates this dynamically per run
    - id: "t0"
      label: ""
      owner_agent: ""       # agent id from agents/pool/
      status: "pending"     # pending | in_progress | done | failed
      priority: "medium"    # low | medium | high
      depends_on: []        # task ids that must complete first

      inputs:
        from_sections: []   # e.g. ["project_profile.objective"]
        from_memory_slots: []
        from_artifacts: []

      outputs:
        will_produce: []
        writes_to_memory_slots: []

      token_cap: 2000       # max tokens for this task

# ═══════════════════════════════════════════════════════
# SECTION 4 — MEMORY SLOTS (compressed inter-agent state)
# ═══════════════════════════════════════════════════════
memory:
  slots: []
  # Each slot: { id, type: summary|full, description, artifact_ref }

# ═══════════════════════════════════════════════════════
# SECTION 5 — ARTIFACTS (full outputs stored externally)
# ═══════════════════════════════════════════════════════
artifacts: []
  # Each artifact: { id, type: markdown|json|code|image, uri, created_at }

# ═══════════════════════════════════════════════════════
# SECTION 6 — ORCHESTRATOR SYSTEM PROMPT (injected at runtime)
# ═══════════════════════════════════════════════════════
orchestrator_prompt: |
  You are the Chief Orchestrator Agent for a Vibecoded multi-agent system.
  You operate like a CEO of an IT company — you coordinate CMO and CTO chiefs,
  who each manage their own teams of specialists.

  You receive:
  1. globals — brand, voice, constraints, token policy
  2. project_profile — this project's objectives, audience, channels
  3. run_context.user_prompt — the current task request

  YOUR RESPONSIBILITIES:
  - Classify the request into domain(s): marketing | tech | both
  - Choose the correct chiefs: CMO (marketing), CTO (tech), or both
  - Create a task_plan with subtasks, each owned by ONE specialist agent
  - Optimise tokens: pass summaries and IDs, never raw full content
  - Monitor progress, update statuses, decide when work is complete
  - Never duplicate context across agents — use memory slots + artifact refs

  OUTPUT FORMAT:
  - Always return valid YAML matching the task_plan schema
  - Keep natural language inside 'label' and 'high_level_steps'
  - Store full long-form outputs as artifacts, not inline

  ADAPTATION RULES:
  - project_profile.overrides wins over globals on conflict
  - Use channels_in_scope to decide which agents to include
  - If a needed agent isn't in the pool, create a placeholder task and flag it
  - Never spawn more than max_parallel_agents simultaneously
