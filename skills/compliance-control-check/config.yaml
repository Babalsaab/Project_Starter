id: compliance-control-check
name: "Compliance Control Check"
description: "Maps controls to compliance frameworks, conducts gap assessments, and prepares audit evidence for SOC 2, HIPAA, PCI DSS, ISO 27001, GDPR, and FedRAMP."
version: "1.0.0"
compatible_agents:
  - compliance_engineer
  - security_engineer
  - cloud_security_engineer
  - devops_engineer
compatible_domains:
  - "tech/security"
required_inputs: []
provides_outputs:
  - compliance_report
  - control_matrix
  - gap_assessment
  - risk_register
priority: 12
enabled: true
